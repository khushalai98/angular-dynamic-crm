<app-navsetting></app-navsetting>

<div class="container-fluid py-4">


    <!-- Section Header with "Add user" button -->
    <div class="d-flex justify-content-between align-items-center mb-3 px-3">
        <div>
            <h4 class="mat-h4 mb-0">Users</h4>
            <p class="mat-body-medium text-secondary">Workspace administrators can add, manage, and remove users.</p>
        </div>
        <button mat-flat-button class="add-user-button d-flex align-items-center gap-1" (click)="openAddUserModal()">
            <mat-icon>add</mat-icon>
            <span>Add user</span>
        </button>
    </div>

    <mat-list class="user-list">
        <!-- Repeat for each user -->
        <div *ngFor="let user of users; let last=last ">
            <mat-list-item class="user-item">

                <div class="user-row-container">

                    <!-- Left Side: Avatar + Name/Email -->
                    <div class="user-info-group">
                        <div class="avatar-circle">
                            {{ user.initials }}
                        </div>
                        <div class="user-text">
                            <div class="fw-medium">{{ user.name }}</div>
                            <div class="text-secondary text-sm">{{ user.email }}</div>
                        </div>
                    </div>

                    <!-- Right Side: Role Dropdown & Menu -->
                    <div class="user-action">

                        <mat-form-field appearance="outline" class="role-select-field">
                            <mat-select [(value)]="user.role">
                                <mat-option value="Viewer">Viewer</mat-option>
                                <mat-option value="Member">Member</mat-option>
                                <mat-option value="Contributor">Contributor</mat-option>
                                <mat-option value="Admin">Admin</mat-option>
                            </mat-select>
                        </mat-form-field>

                        <!-- 3-Dots Menu Button -->
                        <button mat-icon-button [matMenuTriggerFor]="userMenu">
                            <!-- three dot icon -->
                            <mat-icon>more_vert</mat-icon>
                        </button>

                        <!-- Context Menu with Edit & Remove -->
                        <mat-menu #userMenu="matMenu">
                            <button mat-menu-item (click)="editUser(user)">
                                <mat-icon>edit</mat-icon>
                                <span>Edit user</span>
                            </button>
                            <button mat-menu-item class="text-danger" (click)="removeUser(user)">
                                <mat-icon color="warn">delete</mat-icon>
                                <span>Remove user</span>
                            </button>
                        </mat-menu>
                    </div>

                </div>

            </mat-list-item>

            <!-- if = "true" then run else not run -->
            <mat-divider *ngIf="!last"></mat-divider>
        </div>


    </mat-list>

    <!-- pending invitation -->
    <div class="d-flex justify-content-between align-items-center mb-3 px-3">
        <div>
            <h4 class="mat-h4 mt-4">Pending invitations</h4>
        </div>
    </div>

    <mat-list class="user-list">
        <div *ngFor="let user of pendingUsers; let last = last">
            <mat-list-item class="user-item">

                <div class="user-row-container">
                    <!-- Left Side: Dashed Avatar + Email & Expiration -->
                    <div class="user-info-group">
                        <div class="avatar-circle pending-avatar">
                            {{ user.initials }}
                        </div>
                        <div class="user-text">
                            <div class="fw-medium">{{ user.email }}</div>
                            <div class="text-secondary text-sm">{{ user.expiration }}</div>
                        </div>
                    </div>

                    <!-- Right Side: Role Dropdown & Menu -->
                    <div class="user-actions">

                        <mat-form-field appearance="outline" class="role-select-field">
                            <mat-select [(value)]="user.role">
                                <mat-option value="Viewer">Viewer</mat-option>
                                <mat-option value="Member">Member</mat-option>
                                <mat-option value="Contributor">Contributor</mat-option>
                                <mat-option value="Admin">Admin</mat-option>
                            </mat-select>
                        </mat-form-field>

                        <button mat-icon-button [matMenuTriggerFor]="pendingMenu">
                            <mat-icon>more_vert</mat-icon>
                        </button>

                        <mat-menu #pendingMenu="matMenu">
                            <button mat-menu-item (click)="resendInvitation(user)">
                                <mat-icon>send</mat-icon>
                                <span>Resend invitation</span>
                            </button>
                            <button mat-menu-item class="text-danger" (click)="cancelInvitation(user)">
                                <mat-icon color="warn">delete</mat-icon>
                                <span>Cancel invitation</span>
                            </button>
                        </mat-menu>
                    </div>
                </div>

            </mat-list-item>

            <!-- Divider underneath, hiding it for the very last item -->
            <mat-divider *ngIf="!last"></mat-divider>
        </div>
    </mat-list>
</div>
